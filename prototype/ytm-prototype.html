<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YT Manager: design prototype v2 (fictional data)</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#14171c;--muted:#5a6270;--line:#d9dde3;--brand:#1f5eff;--brand-ink:#fff;--go:#15803d;--stop:#c62828;--ok:#0a7a3b;--okbg:#e2f5ea;--warn:#8a5a00;--warnbg:#fff1d6;--bad:#a4161a;--badbg:#fde4e4}
@media (prefers-color-scheme:dark){:root{--bg:#0f1216;--card:#181c22;--ink:#eef0f3;--muted:#a3abb8;--line:#2c323b;--brand:#6c93ff;--brand-ink:#0b0d11;--go:#22a55a;--stop:#e5484d;--ok:#6fdc9a;--okbg:#12301f;--warn:#f1c668;--warnbg:#33290f;--bad:#ff8c8f;--badbg:#3a1618}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
[hidden]{display:none!important}
.banner{background:var(--warnbg);color:var(--warn);padding:6px 16px;font-size:.85rem;text-align:center}
.proto{display:flex;flex-wrap:wrap;gap:6px;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--card);align-items:center}
.proto b{margin-right:4px;font-size:.75rem;color:var(--muted)}
.pill{font:inherit;font-size:.82rem;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:4px 11px;cursor:pointer}
.pill.on{background:var(--ink);color:var(--bg)}
.top{display:flex;gap:12px;align-items:center;background:var(--card);border-bottom:1px solid var(--line);padding:8px 16px}
.brand{font-weight:700}.top nav{display:flex;gap:4px;flex:1;flex-wrap:wrap}
.top a{padding:8px 12px;border-radius:8px;text-decoration:none;color:var(--ink);cursor:pointer}
.top a.on{background:var(--brand);color:var(--brand-ink)}
.me{color:var(--muted);font-size:.9rem}
.sep{width:1px;background:var(--line);margin:4px 6px;align-self:stretch}
main{max-width:760px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:0 0 14px}
.hero{text-align:center;padding:30px 16px}
.date{color:var(--muted);font-size:.95rem}.state{font-size:1.7rem;font-weight:700;margin:.15em 0}
.btn{font:inherit;font-weight:600;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 16px;min-height:44px;cursor:pointer}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.go{background:var(--go);color:#fff;border-color:var(--go)}
.btn.stop{background:var(--stop);color:#fff;border-color:var(--stop)}
.btn.xl{font-size:1.35rem;padding:16px 40px;min-width:260px;margin-top:12px}
.btn.small{padding:6px 12px;min-height:36px;font-size:.9rem}
.chip{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--line);font-size:.8rem;font-weight:600}
.chip.ok{background:var(--okbg);color:var(--ok)}.chip.warn{background:var(--warnbg);color:var(--warn)}.chip.bad{background:var(--badbg);color:var(--bad)}
.chip.owner{background:var(--ink);color:var(--bg)}
.muted{color:var(--muted)}.small{font-size:.875rem}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
h2{font-size:1.1rem;margin:0 0 8px}
.err{background:var(--badbg);color:var(--bad);padding:10px 12px;border-radius:8px;font-weight:600;margin-top:12px}
.item{padding:10px 0;border-top:1px solid var(--line)}.item:first-child{border-top:0}
input,textarea,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;min-height:44px}
label.f{display:block;margin:10px 0 0}label.f span{display:block;font-weight:600;margin-bottom:3px}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);padding:18px;width:min(560px,calc(100vw - 24px))}
dialog::backdrop{background:rgba(0,0,0,.5)}dialog h2{font-size:1.25rem}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted);font-size:.85rem}
.bar{height:12px;background:var(--line);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--go)}
.big{font-size:2.4rem;font-weight:800;line-height:1}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:12px}
.fact{background:var(--bg);border-radius:10px;padding:10px}.fact .l{color:var(--muted);font-size:.8rem}.fact .v{font-weight:700}
.tabs{display:flex;gap:4px;margin:0 0 12px}.tabs .btn{border-radius:999px;min-height:38px;padding:6px 16px}.tabs .btn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sub{background:var(--bg);border-radius:10px;padding:12px;margin:0 0 10px}
.toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:9}
.cmp{display:flex;gap:6px;align-items:center}.up{color:var(--ok);font-weight:700}.down{color:var(--bad);font-weight:700}
@media (max-width:560px){.btn.xl{width:100%}.top{flex-wrap:wrap}}
</style>
</head>
<body>
<div class="banner">Prototype v2 with fictional data. Nothing is saved or connected to any real system.</div>
<div class="proto" aria-label="Prototype controls">
  <b>VIEW AS</b>
  <button class="pill on" data-role="employee">Employee (Sara)</button>
  <button class="pill" data-role="manager">Manager</button>
  <button class="pill" data-role="admin">Owner/Admin</button>
  <b id="stl" style="margin-left:12px">TODAY</b>
  <button class="pill on" data-state="before">Before</button>
  <button class="pill" data-state="work">Working (Clock out opens from here)</button>
  <button class="pill" data-state="after">After</button>
</div>
<header class="top"><div class="brand">YT Manager</div><nav id="nav"></nav><div class="me" id="me"></div></header>
<main id="main"></main>
<div id="toast" class="toast" role="status" hidden></div>

<dialog id="dlg"></dialog>

<script>
const $ = (s, r = document) => r.querySelector(s);
const main = $('#main'), nav = $('#nav'), dlg = $('#dlg');
let role = 'employee', state = 'before', page = 'today', showErr = false, taskId = null, tdTab = 'work', rpt = 'week';
const corr = { sara: 'pending', ali: 'open' };
const WHO = {
  employee: { name: 'Sara', job: 'Editor', task: 'V4 · Intro edit', st: 'In Progress', due: 'Fri 31 Oct', today: '2 h 05', more: [['V3 · Thumbnail set', 'Mon 3 Nov', 'sw'], ['V2 · Title research', 'Tue 4 Nov', 'blocked'], ['V1 · Outro cleanup', '', 'sw']], done: [['V4 · Intro edit', 'Tue 28'], ['V1 · Script draft', 'Mon 27']], doing: 'V3 · Thumbnail set', week: { pct: 83, of: '5 of 6 tasks delivered', days: '4 of 5 days', time: '22 h 10' } },
  manager: { name: 'Omar', job: 'Writer', task: 'V2 · Script: Ancient Rome', st: 'In Progress', due: 'Thu 30 Oct', today: '1 h 40', more: [['V5 · Script: Silk Road', 'Mon 3 Nov', 'sw']], done: [['V1 · Script: Vikings', 'Tue 28']], doing: 'V5 · Script: Silk Road', week: { pct: 100, of: '2 of 2 tasks delivered', days: '5 of 5 days', time: '19 h 30' } },
  admin: { name: 'Owner', job: 'Owner', task: null, st: '', due: '', today: '0 h 00', more: [], done: [], doing: null, week: { pct: 100, of: 'No personal goal set', days: '5 of 5 days', time: '0 h 00' } },
};
const who = () => WHO[role];

const NAV = {
  employee: [['today', 'Today'], ['history', 'My History & Reports']],
  manager: [['today', 'Today'], ['history', 'My History & Reports'], ['|'], ['team', 'Team'], ['reports', 'Reports'], ['fix', 'Corrections']],
  admin: [['today', 'Today'], ['history', 'My History & Reports'], ['|'], ['team', 'Team'], ['reports', 'Reports'], ['fix', 'Corrections'], ['people', 'People'], ['settings', 'Settings']],
};
const toast = (m) => { const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => (t.hidden = true), 2800); };
function open(html) { dlg.innerHTML = html; dlg.showModal(); }
const close = () => dlg.close();

function setRole(r) { role = r; page = 'today'; taskId = null; state = 'before'; document.querySelectorAll('[data-state]').forEach((b) => b.classList.toggle('on', b.dataset.state === 'before')); document.querySelectorAll('[data-role]').forEach((b) => b.classList.toggle('on', b.dataset.role === r)); render(); }
function setState(s) { state = s; page = 'today'; taskId = null; document.querySelectorAll('[data-state]').forEach((b) => b.classList.toggle('on', b.dataset.state === s)); render(); }
document.querySelectorAll('[data-role]').forEach((b) => b.addEventListener('click', () => setRole(b.dataset.role)));
document.querySelectorAll('[data-state]').forEach((b) => b.addEventListener('click', () => setState(b.dataset.state)));

function render() {
  nav.innerHTML = NAV[role].map(([id, l]) => id === '|' ? '<span class="sep" aria-hidden="true"></span>' : `<a class="${id === page ? 'on' : ''}" data-p="${id}" tabindex="0">${l}</a>`).join('');
  nav.querySelectorAll('a').forEach((a) => a.addEventListener('click', () => { page = a.dataset.p; taskId = null; render(); }));
  $('#me').textContent = role === 'employee' ? 'Sara' : role === 'manager' ? 'Omar · Manager' : 'Owner';
  const own = page === 'today' || page === 'history';
  main.innerHTML = (own ? employeeView : managerView)();
  wire();
}

/* ---------------- EMPLOYEE ---------------- */
function employeeView() {
  if (page === 'history') return historyView();
  const W = who();
  const date = '<div class="date">Wed 29 Oct · Shift 14:00 to 20:00</div>';
  if (state === 'before') return `<section class="card hero">${date}<div class="state">Not clocked in</div>
    <button class="btn go xl" id="clockIn">Clock in</button>
    ${showErr ? '<div class="err" role="alert">Not on the office Wi-Fi. Connect and try again.</div>' : ''}
    <p class="small muted"><a href="#" id="toggleErr">${showErr ? 'hide' : 'show'} failed-check example</a></p></section>`;
  if (state === 'work') return `<section class="card hero">${date}<div class="state">Clocked in 14:02</div><div class="muted">3 h 10 min</div>
    <button class="btn stop xl" id="clockOut">Clock out</button></section>
    <section class="card"><div class="row between"><h2>My Work</h2><span class="muted small">Today ${W.today}</span></div>
      ${W.task ? `<div class="row between"><div><strong>${W.task}</strong><div class="row small" style="margin-top:2px"><span class="chip ok">${W.st}</span><span class="muted">Due ${W.due}</span></div></div><button class="btn small" id="upBtn">Update</button></div>` : '<p class="muted">No tasks assigned to you.</p>'}
      ${W.more.length ? `<details style="margin-top:10px"><summary class="muted">${W.more.length} more task${W.more.length > 1 ? 's' : ''}</summary>${W.more.map(([n, d, k]) => `<div class="item row between"><div>${n}${d ? ` <span class="muted small">· ${d}</span>` : ''}</div>${k === 'blocked' ? '<span class="chip warn">Blocked</span>' : '<button class="btn small">Switch</button>'}</div>`).join('')}</details>` : ''}</section>`;
  return `<section class="card hero">${date}<div class="state">Clocked out 20:03</div><div class="muted">6 h 01 min</div>
    <p><span class="chip ok">✓ Work saved</span> <a href="#" id="viewSaved">View</a></p></section>`;
}
function clockOutDlg() {
  open(`<h2>Clock out</h2>
    ${who().task ? '<div class="item row between"><strong>' + who().task + '</strong><span class="chip ok">Update saved 16:40 ✓</span></div>' : ''}
    <div class="item"><strong>${who().doing || 'Other work'}</strong>
      <label class="f"><span>Link</span><input value="https://drive.example.com/f/thumbs-v3"></label>
      <label class="f"><span>What did you do?</span><textarea rows="2" placeholder="One sentence"></textarea></label>
      <details><summary class="muted small">Pending or blocked?</summary><textarea rows="2"></textarea></details></div>
    <a href="#" class="small" onclick="return false">+ Other work</a>
    <div class="row between" style="margin-top:14px"><a href="#" class="small muted" onclick="return false">Can't submit?</a>
      <span class="row"><button class="btn" id="x">Cancel</button><button class="btn stop" id="ok">Submit &amp; clock out</button></span></div>`);
  $('#x').onclick = close; $('#ok').onclick = () => { close(); setState('after'); toast('Saved ✓'); };
}
function updateDlg() {
  open(`<h2>Update · ${who().task}</h2>
    <label class="f"><span>Link</span><input value="https://drive.example.com/f/v4-intro"></label>
    <label class="f"><span>What did you do?</span><textarea rows="3" placeholder="e.g. Intro and 12 sections edited; 8 remaining"></textarea></label>
    <details><summary class="muted small">Pending or blocked?</summary><textarea rows="2"></textarea></details>
    <div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn" id="x">Cancel</button><button class="btn primary" id="ok">Save</button></div>`);
  $('#x').onclick = close; $('#ok').onclick = () => { close(); toast('Saved ✓'); };
}

function historyView() {
  const w = rpt === 'week';
  const W = who(); const goal = w ? W.week : { pct: 91, of: '21 of 23 tasks delivered', days: '17 of 18 days', time: '88 h 40' };
  return `<div class="tabs"><button class="btn ${w ? 'on' : ''}" data-rpt="week">This week</button><button class="btn ${w ? '' : 'on'}" data-rpt="month">This month</button></div>
  <section class="card"><div class="muted small">${w ? 'Weekly' : 'Monthly'} goal</div><div class="row" style="align-items:baseline"><span class="big">${goal.pct}%</span><span class="muted">${goal.of}</span></div>
    <div class="bar" style="margin:10px 0"><i style="width:${goal.pct}%"></i></div>
    <div class="facts"><div class="fact"><div class="l">Days present</div><div class="v">${goal.days}</div></div><div class="fact"><div class="l">Tasks delivered</div><div class="v">${goal.of.split(' tasks')[0]}</div></div><div class="fact"><div class="l">Recorded task time</div><div class="v">${goal.time}</div></div></div></section>
  <section class="card"><h2>Tasks done</h2>
    ${W.done.map(([n, d]) => `<div class="item row between"><span>${n}</span><span class="chip ok">Ready for Upload · ${d}</span></div>`).join('') || '<p class="muted">None yet.</p>'}
    ${W.doing ? `<div class="item row between"><span>${W.doing}</span><span class="chip">In progress</span></div>` : ''}</section>
  <section class="card"><h2>Days</h2><table><tbody>
    <tr><td>Wed 29</td><td>6 h 01</td><td>2 updates</td><td></td></tr>
    <tr><td>Tue 28</td><td>5 h 48</td><td>1 update</td><td><a href="#" id="reqCorr">Request correction</a></td></tr>
    <tr><td>Mon 27</td><td>6 h 05</td><td>2 updates</td><td></td></tr></tbody></table></section>`;
}
function reqCorrDlg() {
  open(`<h2>Request correction · Tue 28</h2>
    <label class="f"><span>Clock-out should be</span><input type="time" value="20:00"></label>
    <label class="f"><span>Reason</span><textarea rows="2" placeholder="One sentence"></textarea></label>
    <div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn" id="x">Cancel</button><button class="btn primary" id="ok">Send</button></div>`);
  $('#x').onclick = close; $('#ok').onclick = () => { close(); toast('Sent to your manager'); };
}

/* ---------------- MANAGER / ADMIN ---------------- */
function managerView() {
  if (taskId) return taskDetail();
  if (page === 'reports') return reportsView();
  if (page === 'fix') return fixView();
  if (page === 'people') return `<section class="card"><h2>People</h2><div class="sub">2 computers waiting for approval · <a href="#" onclick="return false">Review</a></div><p class="muted">Employees, jobs, shifts, ClickUp accounts. (Same as today.)</p></section>`;
  if (page === 'settings') return `<section class="card"><h2>Settings</h2><p>Office network · ClickUp · Shifts · Goals · Checks · Audit history</p><p class="muted small">Section links at the top of one page.</p></section>`;
  return `<section class="card slim row between"><span><strong>ClickUp updated 18:31 ✓</strong></span><button class="btn small" id="syncBtn">Sync now</button></section>
    ${role === 'admin' ? '<div class="sub">2 computers waiting for approval · <a href="#" onclick="return false">Review</a></div>' : ''}
    <section class="card"><h2>Team</h2>
    ${[
      ['Sara', 'ok', 'In since 14:02', 'V4 · Intro edit · due Fri 31', '“Intro and 12 sections edited; 8 left” · 16:40', 'v4'],
      ['Ali', 'bad', 'Missing clock-out', 'No timed task', '', 'v3'],
      ['Huda', 'ok', 'In since 13:58', 'V1 · Script draft · due Thu 30', 'No update yet', 'v1'],
      ['Zayn', 'warn', 'Not in yet', 'V2 · Title research · Blocked', '', 'v2'],
    ].map(([n, k, s, t, u, id]) => `<div class="item row between"><div><strong>${n}</strong> <span class="chip ${k}">${s}</span><div class="small">${t}</div>${u ? `<div class="small ${u.startsWith('No') ? '' : 'muted'}" ${u.startsWith('No') ? 'style="color:var(--warn)"' : ''}>${u}</div>` : ''}</div><button class="btn small" data-task="${id}">Open</button></div>`).join('')}</section>`;
}

function taskDetail() {
  const tabs = [['work', 'Work'], ['time', 'Time'], ['hist', 'History']];
  let body = '';
  if (tdTab === 'work') body = `
    <div class="sub"><div class="row between"><strong>Today 16:40</strong><span class="chip">Not reviewed</span></div>
      <div>Intro and 12 sections edited; 8 sections remaining.</div><div class="small">Left: colour and music</div>
      <div class="row" style="margin-top:8px"><a href="#" onclick="return false">Project link</a><button class="btn small" data-act="note">Add note</button></div></div>
    <div class="sub"><div class="row between"><strong>Tue 28 16:10</strong><span class="chip">Not reviewed</span></div>
      <div>Rough cut done, starting intro.</div><div class="row" style="margin-top:8px"><a href="#" onclick="return false">Project link</a></div></div>`;
  if (tdTab === 'time') body = `<table><thead><tr><th>Day</th><th>Time on task</th><th></th></tr></thead><tbody>
    <tr><td>Wed 29 (so far)</td><td>2 h 05</td><td></td></tr><tr><td>Tue 28</td><td>2 h 27</td><td></td></tr><tr><td>Mon 27</td><td>0 h 00</td><td class="muted small">Started 10:12, not clocked in</td></tr></tbody>
    <tfoot><tr><th>Total</th><th>4 h 32</th><th></th></tr></tfoot></table><p class="muted small">Only while clocked in and In Progress.</p>`;
  if (tdTab === 'hist') body = `<div class="item row between"><span>Deadline moved Thu 30 → Fri 31 <span class="muted small">(before it was due)</span></span><span class="muted small">Mon 27 11:30</span></div>
    <div class="item row between"><span>Started: moved to In Progress</span><span class="muted small">Mon 27 10:12</span></div>
    <div class="item row between"><span>Assigned to Sara</span><span class="muted small">Mon 27 09:40</span></div>`;
  return `<p><a href="#" id="back">‹ Team</a></p>
  <section class="card"><div class="row between"><div><h2 style="margin:0">V4 · Intro edit</h2><div class="muted small">Sara · <a href="#" onclick="return false">Open in ClickUp</a></div></div><span class="chip ok">In Progress</span></div>
    <div class="facts"><div class="fact"><div class="l">Deadline</div><div class="v">Fri 31 Oct</div></div><div class="fact"><div class="l">Delivered</div><div class="v">Not yet</div></div><div class="fact"><div class="l">Time on task</div><div class="v">4 h 32</div></div><div class="fact"><div class="l">Last update</div><div class="v">Today 16:40</div></div></div>
    <div class="row" style="margin-top:12px"><button class="btn small" data-act="changes">Request changes</button></div></section>
  <div class="tabs">${tabs.map(([id, l]) => `<button class="btn ${tdTab === id ? 'on' : ''}" data-td="${id}">${l}</button>`).join('')}</div>
  <section class="card">${body}</section>`;
}

function reportsView() {
  const isOwner = role === 'admin';
  const rows = [['Sara', 83, '5 of 6', '4 of 5', '+1 task', 'up'], ['Ali', 67, '4 of 6', '4 of 5', '−1 task', 'down'], ['Huda', 100, '6 of 6', '5 of 5', 'same', ''], ['Zayn', 50, '3 of 6', '3 of 5', '−2 tasks', 'down']];
  return `<div class="tabs"><button class="btn on">This week</button><button class="btn">This month</button></div>
  <section class="card"><div class="row between"><h2 style="margin:0">Goal achieved</h2>${isOwner ? '<span class="chip owner">Owner view: comparison included</span>' : '<span class="muted small">No comparison with earlier periods</span>'}</div>
  <table style="margin-top:8px"><thead><tr><th>Person</th><th>Goal</th><th>Tasks delivered</th><th>Days present</th>${isOwner ? '<th>vs last week</th>' : ''}</tr></thead><tbody>
  ${rows.map(([n, p, t, d, c, k]) => `<tr><td><strong>${n}</strong></td><td><div class="row"><span style="min-width:2.6em">${p}%</span><div class="bar" style="width:80px"><i style="width:${p}%"></i></div></div></td><td>${t}</td><td>${d}</td>${isOwner ? `<td class="${k}">${c}</td>` : ''}</tr>`).join('')}</tbody></table>
  <p class="muted small">Goal = tasks delivered against the weekly target set by the Owner for each job. Shifts and task size differ, so this is not a ranking.</p></section>`;
}

function fixView() {
  const sara = corr.sara === 'pending'
    ? `<div class="item"><div class="row between"><div><strong>Sara</strong> asks to change Tue 28 <span class="chip warn">Waiting</span><div class="small muted">Clock-out 19:30 → 20:00 · “Forgot to clock out at 19:30, left at 20:00.”</div></div>
        <span class="row"><button class="btn small" data-act="declineSara">Decline</button><button class="btn small primary" data-act="reviewSara">Review</button></span></div></div>`
    : `<div class="item"><strong>Sara</strong> · Tue 28 <span class="chip ${corr.sara === 'approved' ? 'ok' : 'bad'}">${corr.sara === 'approved' ? 'Approved: clock-out now 20:00' : 'Declined'}</span></div>`;
  const ali = corr.ali === 'open'
    ? `<div class="item"><div class="row between"><div><strong>Ali</strong> · Mon 27 <span class="chip bad">Missing clock-out</span><div class="small muted">Clocked in 14:01 · shift ended 20:00</div></div>
        <span class="row"><button class="btn small" data-act="askAli">Ask Ali</button><button class="btn small primary" data-act="setAli">Set time</button></span></div></div>`
    : corr.ali === 'asked'
      ? `<div class="item"><div class="row between"><div><strong>Ali</strong> · Mon 27 <span class="chip warn">Waiting for Ali</span></div><button class="btn small primary" data-act="setAli">Set time</button></div></div>`
      : `<div class="item"><strong>Ali</strong> · Mon 27 <span class="chip ok">Fixed: clock-out 19:45</span></div>`;
  return `<section class="card"><h2>Corrections</h2>${sara}${ali}</section>`;
}
function reviewSaraDlg() {
  open(`<h2>Sara · Tue 28</h2>
    <table><thead><tr><th></th><th>Recorded</th><th>Sara asks</th></tr></thead><tbody><tr><td>Clock in</td><td>14:03</td><td>14:03</td></tr><tr><td>Clock out</td><td>19:30</td><td><strong>20:00</strong></td></tr><tr><td>On site</td><td>5 h 27</td><td>5 h 57</td></tr></tbody></table>
    <p class="small muted">Her shift ends 20:00. Her reason: “Forgot to clock out at 19:30, left at 20:00.”</p>
    <label class="f"><span>Note (only if declining)</span><input placeholder="Optional"></label>
    <div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn" id="x">Close</button><button class="btn" id="no">Decline</button><button class="btn go" id="yes">Approve &amp; apply</button></div>`);
  $('#x').onclick = close; $('#no').onclick = () => { corr.sara = 'declined'; close(); render(); toast('Declined, Sara is told'); };
  $('#yes').onclick = () => { corr.sara = 'approved'; close(); render(); toast('Applied. Saved in the audit history'); };
}
function setAliDlg() {
  open(`<h2>Ali · Mon 27 · clock-out time</h2>
    <label class="f"><span>He left at</span><input type="time" value="19:45"></label>
    <label class="f"><span>Reason (saved in the audit history)</span><input value="Ali confirmed he left at 19:45"></label>
    <div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn" id="x">Cancel</button><button class="btn primary" id="ok">Save</button></div>`);
  $('#x').onclick = close; $('#ok').onclick = () => { corr.ali = 'fixed'; close(); render(); toast('Saved ✓'); };
}
function noteDlg(title, btn) {
  open(`<h2>${title}</h2><label class="f"><span>Note</span><textarea rows="3"></textarea></label>
    <div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn" id="x">Cancel</button><button class="btn primary" id="ok">${btn}</button></div>`);
  $('#x').onclick = close; $('#ok').onclick = () => { close(); toast('Saved ✓'); };
}

function wire() {
  $('#clockIn')?.addEventListener('click', () => { if (showErr) return; setState('work'); });
  $('#toggleErr')?.addEventListener('click', (e) => { e.preventDefault(); showErr = !showErr; render(); });
  $('#clockOut')?.addEventListener('click', clockOutDlg);
  $('#upBtn')?.addEventListener('click', updateDlg);
  $('#viewSaved')?.addEventListener('click', (e) => { e.preventDefault(); page = 'history'; render(); });
  $('#reqCorr')?.addEventListener('click', (e) => { e.preventDefault(); reqCorrDlg(); });
  $('#syncBtn')?.addEventListener('click', () => toast('ClickUp updated ✓'));
  document.querySelectorAll('[data-rpt]').forEach((b) => b.addEventListener('click', () => { rpt = b.dataset.rpt; render(); }));
  document.querySelectorAll('[data-task]').forEach((b) => b.addEventListener('click', () => { taskId = b.dataset.task; tdTab = 'work'; render(); }));
  document.querySelectorAll('[data-td]').forEach((b) => b.addEventListener('click', () => { tdTab = b.dataset.td; render(); }));
  $('#back')?.addEventListener('click', (e) => { e.preventDefault(); taskId = null; render(); });
  document.querySelectorAll('[data-act]').forEach((b) => b.addEventListener('click', () => {
    const a = b.dataset.act;
    if (a === 'reviewSara') reviewSaraDlg();
    else if (a === 'declineSara') { corr.sara = 'declined'; render(); toast('Declined, Sara is told'); }
    else if (a === 'askAli') { corr.ali = 'asked'; render(); toast('Asked Ali to confirm'); }
    else if (a === 'setAli') setAliDlg();
    else if (a === 'note') noteDlg('Add a note', 'Save note');
    else if (a === 'changes') noteDlg('Request changes', 'Send request');
  }));
}
setRole('employee');
</script>
</body>
</html>
