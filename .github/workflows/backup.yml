name: monthly-backup
# Exports the live database, encrypts it, and stores it in the PRIVATE repo MisfahOfficial/yt-manager-backups.
# Runs on the 1st of every month and can be started by hand (Actions tab -> monthly-backup -> Run workflow).
on:
  schedule:
    - cron: '17 2 1 * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install wrangler
        working-directory: worker
        run: npm ci
      - name: Export database
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 export ytm --remote --output "$RUNNER_TEMP/backup.sql"
      - name: Check the export is real
        run: |
          test "$(wc -c < "$RUNNER_TEMP/backup.sql")" -gt 10000
          grep -q "CREATE TABLE employees" "$RUNNER_TEMP/backup.sql"
          grep -q "INSERT INTO" "$RUNNER_TEMP/backup.sql"
      - name: Compress and encrypt
        env:
          BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
        run: |
          test -n "$BACKUP_PASSWORD"
          STAMP=$(date -u +%Y-%m-%d)
          gzip -9 -c "$RUNNER_TEMP/backup.sql" | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:BACKUP_PASSWORD -out "$RUNNER_TEMP/ytm-$STAMP.sql.gz.enc"
          rm "$RUNNER_TEMP/backup.sql"
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
      - name: Save to the private backup repository
        env:
          BACKUP_REPO_TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
        run: |
          test -n "$BACKUP_REPO_TOKEN"
          git clone --depth 1 "https://x-access-token:${BACKUP_REPO_TOKEN}@github.com/${{ github.repository_owner }}/yt-manager-backups.git" "$RUNNER_TEMP/bk"
          mkdir -p "$RUNNER_TEMP/bk/backups"
          cp "$RUNNER_TEMP/ytm-$STAMP.sql.gz.enc" "$RUNNER_TEMP/bk/backups/"
          cd "$RUNNER_TEMP/bk"
          git config user.name "yt-manager-backup"
          git config user.email "backup@users.noreply.github.com"
          git add backups
          git commit -m "Backup $STAMP" || echo "nothing new"
          git push
